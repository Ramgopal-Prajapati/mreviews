<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #8a2be2;
            --secondary: #00bfff;
            --accent: #ff0080;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #f0f0f0;
            --text-muted: #a0a0a0;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(18, 18, 18, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 10px;
            color: var(--primary);
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-light);
            display: flex;
            align-items: center;
        }

        .welcome-text i {
            margin-left: 10px;
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            padding: 10px 0;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.15), transparent 70%);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            color: var(--text-muted);
        }

        /* Reviews Section */
        .reviews-section {
            padding: 5px 0 100px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
            font-size: 1.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        /* Review Card */
        .review-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .review-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .review-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .student-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid var(--primary);
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-light);
        }

        .student-course {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .student-course i {
            margin-right: 5px;
            color: var(--secondary);
        }

        .review-text {
            margin-bottom: 20px;
            color: var(--text-light);
            line-height: 1.7;
            font-style: italic;
        }

        .rating {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stars {
            color: gold;
            font-size: 1.1rem;
        }

        .review-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Gradient backgrounds for cards */
        .card-1 {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(138, 43, 226, 0.1) 100%);
        }

        .card-2 {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(0, 191, 255, 0.1) 100%);
        }

        .card-3 {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(255, 0, 128, 0.1) 100%);
        }

        .card-4 {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(138, 43, 226, 0.15) 100%);
        }

        .card-5 {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(0, 191, 255, 0.15) 100%);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .logo, .welcome-text {
                margin-bottom: 10px;
            }
            
            .hero h1 {
                font-size: 1.5rem;
            }
            
            .reviews-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

        // Function to generate star rating HTML
        function generateStars(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= rating) {
                    stars += '<i class="fas fa-star"></i>';
                } else {
                    stars += '<i class="far fa-star"></i>';
                }
            }
            return stars;
        }

        // Function to render reviews
        function renderReviews() {
            const container = document.getElementById('reviews-container');
            
            reviews.forEach((review, index) => {
                const cardClass = `card-${(index % 5) + 1}`;
                const card = document.createElement('div');
                card.className = `review-card ${cardClass}`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <img src="${review.photo}" alt="${review.name}" class="student-photo">
                        <div class="student-info">
                            <h3 class="student-name">${review.name}</h3>
                            <p class="student-course"><i class="fas fa-book"></i> ${review.course}</p>
                        </div>
                    </div>
                    <p class="review-text">"${review.review}"</p>
                    <div class="rating">
                        <div class="stars">
                            ${generateStars(review.rating)}
                        </div>
                        <div class="review-date">${review.date}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', renderReviews);
